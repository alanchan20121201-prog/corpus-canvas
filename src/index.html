            </svg>
          </span>
          <span class="brand-name">Corpus Canvas</span>
        </div>

          <button class="rail-btn" data-nav="home"><span class="ico-wrap" data-icon="home"></span><span class="rail-label" data-i18n="nav.home">首页</span></button>
          <button class="rail-btn" data-nav="map"><span class="ico-wrap" data-icon="map"></span><span class="rail-label" data-i18n="nav.map">图</span></button>
          <button class="rail-btn" data-nav="graph"><span class="ico-wrap" data-icon="link"></span><span class="rail-label" data-i18n="nav.graph">关系图</span></button>

          <button class="rail-btn" data-nav="cards"><span class="ico-wrap" data-icon="cards"></span><span class="rail-label" data-i18n="nav.cards">资料</span></button>
          <button class="rail-btn" data-nav="search"><span class="ico-wrap" data-icon="search"></span><span class="rail-label" data-i18n="nav.search">检索</span></button>
          <button class="rail-btn" data-nav="health"><span class="ico-wrap" data-icon="health"></span><span class="rail-label" data-i18n="nav.health">检查</span></button>
          <button class="rail-btn" data-nav="history"><span class="ico-wrap" data-icon="history"></span><span class="rail-label" data-i18n="nav.history">记录</span></button>
          <button class="rail-btn" data-nav="trash"><span class="ico-wrap" data-icon="trash"></span><span class="rail-label" data-i18n="nav.trash">回收站</span></button>
        </nav>

        <div class="tb-right">
          <button class="search-pill" id="tb-search">
            <span class="sp-ico" data-icon="search"></span>
            <span class="sp-text" id="sp-text">搜索资料…</span>
            <kbd>Ctrl K</kbd>
          </button>
          <div class="tb-group">
            <button class="icon-btn" id="tb-undo" title="Undo"></button>
            <button class="icon-btn" id="tb-redo" title="Redo"></button>
          </div>
          <button class="ai-pill" id="tb-ai">
            <span class="sp-ico" data-icon="sparkles"></span><span id="ai-pill-label">AI</span>
          </button>
          <button class="icon-btn" id="tb-theme" title="Theme"></button>
          <button class="icon-btn" id="tb-help" title="Help"></button>
          <button class="rail-btn small" id="rail-lang" title="Language">
            <span class="ico-wrap" data-icon="globe"></span>
            <span class="rail-label" id="lang-label">简</span>
          </button>
          <button class="rail-btn small" data-nav="settings">
            <span class="ico-wrap" data-icon="settings"></span>
            <span class="rail-label" data-i18n="nav.settings">设置</span>
          </button>
        </div>

      <div class="workspace" id="workspace">
        <main class="view" id="view"></main>
      </div>
