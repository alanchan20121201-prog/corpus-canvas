name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win portable -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v4
        with:
          name: CorpusCanvas-Portable
          path: dist/*.exe
          if-no-files-found: error
